[project]
name = "genai"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = [
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "langfuse>=5",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=3.2.1",
    "numpy>=2.5.4",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle errors/warnings (blank lines, whitespace)
    "F", # pyflakes (unused imports/variables, undefined names)
    "I", # isort (import ordering)
    "B", # bugbear (likely bugs)
    "UP", # pyupgrade (modern syntax)
    "SIM", # simplifications
]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running Postgres (docker compose up -d)"]
