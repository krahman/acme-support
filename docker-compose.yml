services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme_support
    ports:
      - "127.0.0.1:5433:5432"  # 5432 is often taken by other local projects
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme_support"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  pgdata: